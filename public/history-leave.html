<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ประวัติการลา — LeaveHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page-content">
    <div class="card">
      <h1>📄 ประวัติการลา</h1>

      <div id="alert-box"></div>

      <div class="filter-bar">
        <div class="field">
          <label for="f-name">ชื่อพนักงาน</label>
          <input type="text" id="f-name" placeholder="ค้นหาชื่อ">
        </div>
        <div class="field">
          <label for="f-company">บริษัท</label>
          <select id="f-company">
            <option value="">ทั้งหมด</option>
            </select>
        </div>
        <div class="field">
          <label for="f-department">แผนก</label>
          <select id="f-department">
            <option value="">ทั้งหมด</option>
          </select>
        </div>
        <div class="field">
          <label for="f-leave-type">ประเภทลา</label>
          <select id="f-leave-type">
            <option value="">ทั้งหมด</option>
            <option value="business">ลากิจ</option>
            <option value="sick">ลาป่วย</option>
            <option value="vacation">ลาพักร้อน</option>
          </select>
        </div>
        <div class="field">
          <label for="f-date-from">ตั้งแต่วันที่</label>
          <input type="date" id="f-date-from">
        </div>
        <div class="field">
          <label for="f-date-to">ถึงวันที่</label>
          <input type="date" id="f-date-to">
        </div>
        <button class="btn-secondary" id="search-btn">ค้นหา</button>
        <button class="btn-secondary" id="reset-btn">ล้างตัวกรอง</button>
        <button class="btn-secondary" id="report-btn">ดาวน์โหลดรายงานสรุป (CSV)</button>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead>
            <tr>
              <th>วันที่ยื่น</th>
              <th>รหัสพนักงาน</th>
              <th>ชื่อ</th>
              <th>บริษัท</th>
              <th>แผนก</th>
              <th>ประเภทลา</th>
              <th>เริ่มลา</th>
              <th>สิ้นสุด</th>
              <th>จำนวนวัน</th>
              <th>รายละเอียด</th>
              <th>รูปแนบ</th>
              <th>ผู้ยื่นแทน</th>
            </tr>
          </thead>
          <tbody id="table-body">
            <tr><td colspan="12">กำลังโหลด...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="nav.js"></script>
  <script>
    const LEAVE_LABEL = { business: 'ลากิจ', sick: 'ลาป่วย', vacation: 'ลาพักร้อน' };
    const alertBox = document.getElementById('alert-box');
    const tbody = document.getElementById('table-body');
    let currentHistory = [];

    function showAlert(type, message) {
      alertBox.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
    }

    function fmtDateTime(v) {
      if (!v) return '-';
      const d = new Date(v);
      return d.toLocaleString('th-TH', { dateStyle: 'medium', timeStyle: 'short' });
    }

    function cellToCsv(v) {
  const s = String(v ?? '');
  return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function downloadCsv(filename, rows) {
  const csv = '\uFEFF' + rows.map((r) => r.map(cellToCsv).join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function downloadLeaveReport() {
  if (!currentHistory.length) return showAlert('info', 'ไม่มีข้อมูลให้สรุป ลองค้นหาก่อน');
  const byEmployee = new Map();
  currentHistory.forEach((row) => {
    if (!byEmployee.has(row.employee_id)) {
      byEmployee.set(row.employee_id, {
        employee_id: row.employee_id, name: row.name, company: row.company, department: row.department,
        business: 0, sick: 0, vacation: 0
      });
    }
    const rec = byEmployee.get(row.employee_id);
    rec[row.leave_type] = (rec[row.leave_type] || 0) + Number(row.days_used || 0);
  });

  const rows = [['รหัสพนักงาน', 'ชื่อ', 'บริษัท', 'แผนก', 'ลากิจ (วัน)', 'ลาป่วย (วัน)', 'ลาพักร้อน (วัน)', 'รวมทั้งหมด (วัน)']];
  const grand = { business: 0, sick: 0, vacation: 0 };
  [...byEmployee.values()]
    .sort((a, b) => a.name.localeCompare(b.name, 'th'))
    .forEach((rec) => {
      const total = rec.business + rec.sick + rec.vacation;
      grand.business += rec.business; grand.sick += rec.sick; grand.vacation += rec.vacation;
      rows.push([rec.employee_id, rec.name, rec.company, rec.department, rec.business, rec.sick, rec.vacation, total]);
    });
  rows.push(['', '', '', 'รวมทั้งหมด', grand.business, grand.sick, grand.vacation, grand.business + grand.sick + grand.vacation]);

  downloadCsv(`leave-report-${new Date().toISOString().slice(0, 10)}.csv`, rows);
}

    async function loadFilterOptions() {
      try {
        const res = await fetch('/api/attendance/filter-options');
        const data = await res.json();
        if (!res.ok) return;
        const companySelect = document.getElementById('f-company');
        const departmentSelect = document.getElementById('f-department');
        data.companies.forEach((c) => {
          const opt = document.createElement('option');
          opt.value = c; opt.textContent = c;
          companySelect.appendChild(opt);
        });
        data.departments.forEach((d) => {
          const opt = document.createElement('option');
          opt.value = d; opt.textContent = d;
          departmentSelect.appendChild(opt);
        });
      } catch (err) { /* เงียบไว้ — ไม่กระทบการดูประวัติหลัก */ }
    }

    async function loadHistory() {
      tbody.innerHTML = '<tr><td colspan="12">กำลังโหลด...</td></tr>';
      const params = new URLSearchParams();
      const name = document.getElementById('f-name').value.trim();
      const company = document.getElementById('f-company').value.trim();
      const department = document.getElementById('f-department').value.trim();
      const leaveType = document.getElementById('f-leave-type').value;
      const dateFrom = document.getElementById('f-date-from').value;
      const dateTo = document.getElementById('f-date-to').value;
      if (name) params.set('name', name);
      if (company) params.set('company', company);
      if (department) params.set('department', department);
      if (leaveType) params.set('leave_type', leaveType);
      if (dateFrom) params.set('date_from', dateFrom);
      if (dateTo) params.set('date_to', dateTo);

      try {
        const res = await fetch('/api/attendance/leave/history?' + params.toString());
        const data = await res.json();
        if (!res.ok) return showAlert('error', data.error || 'โหลดประวัติไม่สำเร็จ');
        currentHistory = data.history;
        if (!data.history.length) {
          tbody.innerHTML = '<tr><td colspan="12">ไม่พบข้อมูล</td></tr>';
          return;
        }

        tbody.innerHTML = '';
        data.history.forEach((row) => {
          const tr = document.createElement('tr');
          const imageCell = row.image_path
            ? `<a href="${row.image_path}" target="_blank" rel="noopener">ดูรูป</a>`
            : '-';
          tr.innerHTML = `
            <td>${fmtDateTime(row.submitted_at)}</td>
            <td>${window.LeaveHub.escapeHtml(row.employee_id)}</td>
            <td>${window.LeaveHub.escapeHtml(row.name)}</td>
            <td>${window.LeaveHub.escapeHtml(row.company)}</td>
            <td>${window.LeaveHub.escapeHtml(row.department)}</td>
            <td>${LEAVE_LABEL[row.leave_type] || row.leave_type}</td>
            <td>${fmtDateTime(row.start_datetime)}</td>
            <td>${fmtDateTime(row.end_datetime)}</td>
            <td>${row.days_used}</td>
            <td>${window.LeaveHub.escapeHtml(row.detail || '-')}</td>
            <td>${imageCell}</td>
            <td>${window.LeaveHub.escapeHtml(row.submitted_by)}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        showAlert('error', 'เชื่อมต่อเซิร์ฟเวอร์ไม่สำเร็จ');
      }
    }

    document.getElementById('report-btn').addEventListener('click', downloadLeaveReport);
    document.getElementById('search-btn').addEventListener('click', loadHistory);
    document.getElementById('reset-btn').addEventListener('click', () => {
      document.querySelectorAll('.filter-bar input').forEach((el) => el.value = '');
      document.getElementById('f-leave-type').value = '';
      loadHistory();
    });

    window.LeaveHub.ready.then((user) => {
      if (!user) return;
      loadFilterOptions();
      loadHistory();
    });
  </script>
</body>
</html>
